[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossphase-miner"
version = "0.1.0"
description = "Traffic signal period learning and a robot fleet experiment console"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
server = [
  "fastapi>=0.110,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.27,<1",
  "websockets>=12,<17",
  "psycopg[binary]>=3.2,<4",
  "paho-mqtt>=2.1,<3",
]
experiment = ["matplotlib>=3.7,<4"]
dev = ["ruff==0.16.8", "build>=1,<2"]
browser = ["playwright>=1.40,<2"]

[project.scripts]
crossphase-server = "server.app:main"
crossphase-simulate = "crossphase_miner.cli.simulate:main"
crossphase-evaluate = "crossphase_miner.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crossphase_miner*", "server*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
server = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["experiments", "build", "dist", "SPEC.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
